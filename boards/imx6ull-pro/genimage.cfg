image boot.vfat {
  vfat {
    label = "boot"
    files = { "u-boot-dtb.imx", "zImage", "imx6ull-14x14-evk.dtb" }
  }
  size = 32M
}
image sdcard.img {
  hdimage {
  }
  partition u-boot {
    in-partition-table = "no"
    image = "u-boot-dtb.imx"
    offset = 1024
  }
  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
    offset = 8M
  }
  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
