name: DshanControl host gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: sudo apt-get update && sudo apt-get install -y qtbase5-dev libqt5charts5-dev libssl-dev zlib1g-dev
      - run: make test-bootstrap
      - run: make test
      - run: make test-hmi
      - run: git diff --check
